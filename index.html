<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F3F2ED" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Lagar" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <title>Lagar</title>
  </head>
  <body>
    <div id="app"></div>
    <noscript>Lagar needs JavaScript.</noscript>
    <script>
      // If the app cannot start (an old browser, say), show why instead of a blank page.
      // (capture: a script that fails to load reports on its own tag, not on the window)
      window.addEventListener('error', function (e) {
        var app = document.getElementById('app')
        if (app && !app.children.length) {
          app.style.cssText = 'padding:24px;font:16px/1.4 system-ui,sans-serif;color:#1B1815'
          var what = e.message || (e.target && (e.target.src || e.target.href)) || 'unknown error'
          app.textContent = 'Lagar could not start: ' + what + '. Close the app and open it again; if this stays, clear its data.'
        }
      }, true)
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
